name: Validar Universa Art OFICINA 1.2
on:
  push:
    paths:
      - 'preview-v1/**'
      - 'tests/v1-smoke.cjs'
      - 'tests/security-audit.cjs'
      - 'tests/product-excel-v1.cjs'
      - 'tests/compact-entities-v1.cjs'
      - 'tests/unified-contacts-v1.cjs'
      - 'tests/launch-readiness-v1.cjs'
      - 'tests/opencutlist-components-v1.cjs'
      - 'tests/sketchup-project-bridge-v1.cjs'
      - 'tests/drive-backup-v1.cjs'
      - 'tests/drive-google-auth-v1-2.cjs'
      - 'tests/release-v1-2.cjs'
      - 'tests/fixtures/**'
      - 'tests/xlsx-real-v1.cjs'
      - 'script.js'
      - 'cloud-v06.js'
      - 'features-v05.js'
      - 'preview-v1/product-compact-v1.css'
      - 'preview-v1/compact-entities-v1.css'
      - 'preview-v1/compact-entities-v1.js'
      - 'preview-v1/unified-contacts-v1.css'
      - 'preview-v1/unified-contacts-v1.js'
      - '.github/workflows/check-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe, CSV, cálculo e isolamento da prévia
        run: node tests/v1-smoke.cjs && node tests/security-audit.cjs && node tests/product-excel-v1.cjs && node tests/compact-entities-v1.cjs && node tests/unified-contacts-v1.cjs && node tests/launch-readiness-v1.cjs && node tests/opencutlist-components-v1.cjs && node tests/sketchup-project-bridge-v1.cjs && node tests/drive-backup-v1.cjs && node tests/drive-google-auth-v1-2.cjs && node tests/release-v1-2.cjs
      - name: Instalar leitor Excel apenas para testar XLSX real
        run: npm install --no-save --ignore-scripts --no-audit --no-fund exceljs@4.4.0
      - name: Testar leitura de planilha real
        run: node tests/xlsx-real-v1.cjs
