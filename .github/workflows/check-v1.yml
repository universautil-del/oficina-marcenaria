name: Validar Universa Art OFICINA 1.0
on:
  push:
    paths:
      - 'preview-v1/**'
      - 'tests/v1-smoke.cjs'
      - 'tests/security-audit.cjs'
      - 'tests/product-excel-v1.cjs'
      - 'tests/catalogo-produtos-1-0.cjs'
      - 'tests/material-ui-9999.cjs'
      - 'tests/entradas-seguras-v1-3.cjs'
      - 'tests/compact-entities-v1.cjs'
      - 'tests/unified-contacts-v1.cjs'
      - 'tests/cep-autofill-v1.cjs'
      - 'tests/assistente-integrado-v1.cjs'
      - 'tests/logo-upload-oficina-1-0.cjs'
      - 'tests/documentos-padrao-1-0.cjs'
      - 'tests/contrato-universa-art-design-1-0.cjs'
      - 'tests/financeiro-desfazer-pagamento-v1.cjs'
      - 'tests/financeiro-editar-lancamentos-v1.cjs'
      - 'tests/sketchup-material-cadastro-v1.cjs'
      - 'tests/nf-entrada-financeiro-estoque-v1.cjs'
      - 'tests/xml-nfe-itens-v1.cjs'
      - 'tests/medidas-marcenaria-v1.cjs'
      - 'tests/assinatura-logo-documentos-1-0.cjs'
      - 'tests/assinaturas-pedidos-recibos-1-0.cjs'
      - 'tests/launch-readiness-v1.cjs'
      - 'tests/busca-geral-v1.cjs'
      - 'tests/leo-catalogo-v1.cjs'
      - 'tests/acesso-principal-seguro-v1.cjs'
      - 'index.html'
      - 'oficina.html'
      - 'recuperar-dados-locais.html'
      - 'tests/diagnostico-oficina-1-0.cjs'
      - 'tests/menu-organizado-1-0.cjs'
      - 'tests/pwa-install-oficina-1-0.cjs'
      - 'tests/opencutlist-components-v1.cjs'
      - 'tests/sketchup-project-bridge-v1.cjs'
      - 'tests/fluxo-integrado-v1-3.cjs'
      - 'tests/pedidos-abertos-editaveis-v1.cjs'
      - 'tests/ordenacao-listas-tres-modulos-v1.cjs'
      - 'tests/financeiro-parcelas-mensais-v1.cjs'
      - 'tests/relatorio-financeiro-v1.cjs'
      - 'tests/relatorio-financeiro-xlsx-real-v1.cjs'
      - 'tests/project-modal-ux-v1.cjs'
      - 'tests/integracoes-produtividade-1-0.cjs'
      - 'tests/cadastros-encadeados-1-0.cjs'
      - 'tests/secure-auth-v1.cjs'
      - 'tests/secure-gate-dom-v1.cjs'
      - 'supabase/**'
      - 'tests/drive-backup-v1.cjs'
      - 'tests/backup-supabase-semanal-ui.cjs'
      - 'tests/release-v1-2.cjs'
      - 'tests/release-v1-0-secure.cjs'
      - 'tests/fixtures/**'
      - 'tests/xlsx-real-v1.cjs'
      - 'script.js'
      - 'cloud-v06.js'
      - 'features-v05.js'
      - 'preview-v1/product-compact-v1.css'
      - 'preview-v1/compact-entities-v1.css'
      - 'preview-v1/compact-entities-v1.js'
      - 'preview-v1/unified-contacts-v1.css'
      - 'preview-v1/unified-contacts-v1.js'
      - '.github/workflows/check-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe, CSV, cálculo e isolamento da prévia
        run: node tests/v1-smoke.cjs && node tests/security-audit.cjs && node tests/product-excel-v1.cjs && node tests/catalogo-produtos-1-0.cjs && node tests/material-ui-9999.cjs && node tests/entradas-seguras-v1-3.cjs && node tests/compact-entities-v1.cjs && node tests/unified-contacts-v1.cjs && node tests/cep-autofill-v1.cjs && node tests/assistente-integrado-v1.cjs && node tests/logo-upload-oficina-1-0.cjs && node tests/documentos-padrao-1-0.cjs && node tests/contrato-universa-art-design-1-0.cjs && node tests/financeiro-desfazer-pagamento-v1.cjs && node tests/financeiro-editar-lancamentos-v1.cjs && node tests/sketchup-material-cadastro-v1.cjs && node tests/nf-entrada-financeiro-estoque-v1.cjs && node tests/xml-nfe-itens-v1.cjs && node tests/medidas-marcenaria-v1.cjs && node tests/assinatura-logo-documentos-1-0.cjs && node tests/assinaturas-pedidos-recibos-1-0.cjs && node tests/launch-readiness-v1.cjs && node tests/busca-geral-v1.cjs && node tests/leo-catalogo-v1.cjs && node tests/acesso-principal-seguro-v1.cjs && node tests/diagnostico-oficina-1-0.cjs && node tests/menu-organizado-1-0.cjs && node tests/pwa-install-oficina-1-0.cjs && node tests/opencutlist-components-v1.cjs && node tests/sketchup-project-bridge-v1.cjs && node tests/fluxo-integrado-v1-3.cjs && node tests/pedidos-abertos-editaveis-v1.cjs && node tests/ordenacao-listas-tres-modulos-v1.cjs && node tests/financeiro-parcelas-mensais-v1.cjs && node tests/relatorio-financeiro-v1.cjs && node tests/integracoes-produtividade-1-0.cjs && node tests/cadastros-encadeados-1-0.cjs && node tests/project-modal-ux-v1.cjs && node tests/secure-auth-v1.cjs && node tests/secure-gate-dom-v1.cjs && node tests/drive-backup-v1.cjs && node tests/backup-supabase-semanal-ui.cjs && node tests/release-v1-2.cjs && node tests/release-v1-0-secure.cjs
      - name: Instalar leitor Excel apenas para testar XLSX real
        run: npm install --no-save --ignore-scripts --no-audit --no-fund exceljs@4.4.0
      - name: Testar leitura de planilha real
        run: node tests/xlsx-real-v1.cjs && node tests/relatorio-financeiro-xlsx-real-v1.cjs
